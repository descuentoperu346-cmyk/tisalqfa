<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarjeta de identidad familiar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0f0e0d;
      display: grid;
      place-items: center;
      padding: 12px;
    }
    img {
      max-width: 100%;
      max-height: calc(100vh - 24px);
      width: auto;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 20px 50px -15px rgba(0,0,0,.8);
    }
  </style>
</head>
<body>
  <img src="imagen.jpg" alt="Tarjeta de identidad familiar: anverso y reverso" />
</body>
</html>
